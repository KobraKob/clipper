[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Open-Source AI Video Clipper: generate vertical clips with animated captions from long videos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Project Hire Team" }
]
dependencies = [
    "yt-dlp",
    "opencv-python",
    "scenedetect",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
groq = [
    "groq>=0.9.0",
]
local = [
    "faster-whisper>=1.0.0",
]
all = [
    "groq>=0.9.0",
    "faster-whisper>=1.0.0",
    "mediapipe",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
clipper = "clipper.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
