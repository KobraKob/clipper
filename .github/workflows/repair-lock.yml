name: Repair npm lockfile

on:
  push:
    branches:
      - audit/performance-cleanup-ci

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh lockfile from package metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean installation
        run: npm ci --no-audit --no-fund
      - name: Commit and push lockfile refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize web npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
